name: OCR fallback validation

on:
  push:
    branches: [fix/ocr-fallback-validation-540]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          key: ocr-fallback-validation
      - name: Format candidate source on validation branch only
        run: |
          cargo fmt --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/vision/oar.rs
          if ! git diff --cached --quiet; then
            git commit -m 'style(ocr): format fallback admission fix [skip ci]'
            git push origin HEAD:fix/ocr-fallback-validation-540
          fi
      - name: Validate and report actual exit codes
        shell: bash
        run: |
          set +e
          failed=0
          check() {
            local name="$1"
            shift
            "$@" > "/tmp/${name}.log" 2>&1
            local result=$?
            echo "VALIDATION ${name} EXIT_CODE=${result}"
            tail -n 45 "/tmp/${name}.log"
            if [ "$result" -ne 0 ]; then
              failed=1
            fi
          }
          echo "TESTED_COMMIT=$(git rev-parse HEAD)"
          echo "TESTED_SOURCE_BLOB=$(git hash-object src/vision/oar.rs)"
          check fmt cargo fmt --all -- --check
          check clippy cargo clippy -- -D warnings
          check ocr_clippy cargo clippy --features ocr -- -D warnings
          check tests cargo test
          check ocr_tests cargo test --features ocr
          echo "VALIDATION_OVERALL_EXIT_CODE=${failed}"
          exit "$failed"
