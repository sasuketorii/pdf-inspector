name: OCR fallback validation

on:
  push:
    branches: [fix/ocr-fallback-validation-540]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          key: ocr-fallback-validation
      - name: Check formatting
        id: fmt
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: Default Clippy
        id: clippy
        continue-on-error: true
        run: cargo clippy -- -D warnings
      - name: OCR Clippy
        id: ocr_clippy
        continue-on-error: true
        run: cargo clippy --features ocr -- -D warnings
      - name: Default tests
        id: tests
        continue-on-error: true
        run: cargo test
      - name: OCR tests
        id: ocr_tests
        continue-on-error: true
        run: cargo test --features ocr
      - name: Require every check to pass
        if: always()
        env:
          FMT: ${{ steps.fmt.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          OCR_CLIPPY: ${{ steps.ocr_clippy.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          OCR_TESTS: ${{ steps.ocr_tests.outcome }}
        run: |
          for result in "$FMT" "$CLIPPY" "$OCR_CLIPPY" "$TESTS" "$OCR_TESTS"; do
            test "$result" = success || exit 1
          done
